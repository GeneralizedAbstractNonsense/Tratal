<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <title>Home</title>
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-hover: #f1f5f9;
            --border: #e2e8f0;
            --border-hover: #cbd5e1;
            
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-subtle: #94a3b8;
            
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --primary-border: #bfdbfe;

            /* Visual Priority Colors */
            --danger-bg: #fef2f2;
            --danger-text: #dc2626;
            --danger-border: #fecaca;

            --warning-bg: #fffbeeb;
            --warning-text: #d97706;
            --warning-border: #fef3c7;

            --info-bg: #eff6ff;
            --info-text: #2563eb;
            --info-border: #bfdbfe;

            --success-bg: #f0fdf4;
            --success-text: #16a34a;
            --success-border: #bbf7d0;
            
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 8px;
            
            --shadow-subtle: 0 2px 10px rgba(0, 0, 0, 0.03);
            --shadow-elevated: 0 12px 24px -6px rgba(0, 0, 0, 0.06);
            --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #090d16;
                --surface: #131b2e;
                --surface-hover: #1c2742;
                --border: #1e293b;
                --border-hover: #334155;
                
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --text-subtle: #64748b;
                
                --primary: #3b82f6;
                --primary-light: rgba(59, 130, 246, 0.12);
                --primary-border: rgba(59, 130, 246, 0.3);

                --danger-bg: rgba(220, 38, 38, 0.15);
                --danger-text: #f87171;
                --danger-border: rgba(220, 38, 38, 0.3);

                --warning-bg: rgba(217, 119, 6, 0.15);
                --warning-text: #fbbf24;
                --warning-border: rgba(217, 119, 6, 0.3);

                --info-bg: rgba(59, 130, 246, 0.15);
                --info-text: #60a5fa;
                --info-border: rgba(59, 130, 246, 0.3);

                --success-bg: rgba(22, 163, 74, 0.15);
                --success-text: #4ade80;
                --success-border: rgba(22, 163, 74, 0.3);
                
                --shadow-subtle: 0 2px 10px rgba(0, 0, 0, 0.2);
                --shadow-elevated: 0 12px 24px -6px rgba(0, 0, 0, 0.4);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font);
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px 16px calc(88px + env(safe-area-inset-bottom)) 16px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 560px;
            margin: 0 auto;
            width: 100%;
        }

        /* Weather Header Widget */
        .weather-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .weather-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: inherit;
            box-shadow: var(--shadow-subtle);
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), 
                        border-color 0.2s ease, 
                        box-shadow 0.2s ease;
        }

        .weather-card:hover, .weather-card:focus-visible {
            transform: translateY(-2px);
            border-color: var(--border-hover);
            box-shadow: var(--shadow-elevated);
            outline: none;
        }

        .weather-city {
            font-size: 0.725rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .weather-value {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 1.05rem;
            font-weight: 600;
            margin-top: 2px;
        }

        .skeleton {
            width: 50px;
            height: 20px;
            background: linear-gradient(90deg, var(--border) 25%, var(--surface-hover) 50%, var(--border) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 4px;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* App Header */
        header {
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
        }

        header h1 {
            font-size: 1.65rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--text-main);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 2px;
        }

        .btn-refresh {
            background-color: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-refresh:hover {
            color: var(--primary);
            border-color: var(--primary-border);
            background-color: var(--surface-hover);
        }

        .btn-refresh.spinning svg {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Tab Content Transitions */
        .tab-content {
            display: none;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .tab-content.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* Routes Layout */
        .routes-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .route-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 18px 20px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: var(--shadow-subtle);
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), 
                        border-color 0.2s ease, 
                        box-shadow 0.2s ease;
        }

        .route-card:hover, .route-card:focus-visible {
            transform: translateY(-2px);
            border-color: var(--primary-border);
            box-shadow: var(--shadow-elevated);
            outline: none;
        }

        .route-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .route-title {
            font-size: 1.05rem;
            font-weight: 600;
        }

        .route-icon-arrow {
            width: 18px;
            height: 18px;
            stroke: var(--text-subtle);
            transition: transform 0.2s ease, stroke 0.2s ease;
        }

        .route-card:hover .route-icon-arrow {
            transform: translateX(3px);
            stroke: var(--primary);
        }

        .badges-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .badge {
            font-size: 0.725rem;
            font-weight: 600;
            padding: 3px 9px;
            border-radius: 9999px;
            background-color: var(--bg);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        /* Feed Filters Bar (Chips) */
        .feed-filters {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 16px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .feed-filters::-webkit-scrollbar {
            display: none;
        }

        .filter-chip {
            background-color: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .filter-chip:hover {
            border-color: var(--border-hover);
            color: var(--text-main);
        }

        .filter-chip.active {
            background-color: var(--text-main);
            color: var(--bg);
            border-color: var(--text-main);
        }

        /* Feed Section */
        .feed-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .feed-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 18px 20px;
            box-shadow: var(--shadow-subtle);
            transition: transform 0.2s ease;
        }

        .feed-card.type-danger {
            border-left: 4px solid var(--danger-text);
        }

        .feed-card.type-warning {
            border-left: 4px solid var(--warning-text);
        }

        .feed-card.type-info {
            border-left: 4px solid var(--primary);
        }

        .feed-card.type-success {
            border-left: 4px solid var(--success-text);
        }

        .feed-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .feed-tags {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tag-badge {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 2px 8px;
            border-radius: var(--radius-sm);
        }

        .tag-danger {
            background-color: var(--danger-bg);
            color: var(--danger-text);
            border: 1px solid var(--danger-border);
        }

        .tag-warning {
            background-color: var(--warning-bg);
            color: var(--warning-text);
            border: 1px solid var(--warning-border);
        }

        .tag-info {
            background-color: var(--info-bg);
            color: var(--info-text);
            border: 1px solid var(--info-border);
        }

        .tag-success {
            background-color: var(--success-bg);
            color: var(--success-text);
            border: 1px solid var(--success-border);
        }

        .feed-time {
            font-size: 0.75rem;
            color: var(--text-subtle);
            font-weight: 500;
        }

        .feed-card h2 {
            font-size: 1.025rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .feed-card p {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .feed-action-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--primary);
            text-decoration: none;
        }

        .feed-action-link:hover {
            text-decoration: underline;
        }

        .empty-feed {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            background-color: var(--surface);
            border: 1px dashed var(--border);
            border-radius: var(--radius-lg);
        }

        /* Bottom Floating Navbar */
        .bottom-nav-wrapper {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            padding: 0 16px calc(12px + env(safe-area-inset-bottom)) 16px;
            pointer-events: none;
            z-index: 100;
        }

        .bottom-nav {
            pointer-events: auto;
            background-color: var(--surface);
            border: 1px solid var(--border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            border-radius: 9999px;
            padding: 4px;
            box-shadow: var(--shadow-elevated);
            width: 100%;
            max-width: 380px;
        }

        .nav-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            padding: 10px 16px;
            border-radius: 9999px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .nav-btn svg {
            width: 18px;
            height: 18px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
        }

        .nav-btn.active {
            background-color: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }
    </style>
</head>

    <script>
        let allFeedItems = [];
        let currentFilter = 'all';

        // Avvisi Strutturati di Base (utilizzati come garanzia/fallback)
        const transportAlertsBase = [
            {
                id: 'sciopero-garanzia',
                category: 'scioperi',
                isStrike: true,
                type: 'danger',
                tag: '🚨 Sciopero & Garanzie',
                tagClass: 'tag-danger',
                time: 'Info Sempre Valida',
                title: 'Regole Fasce di Garanzia TPL',
                description: 'In caso di sciopero proclamato per ATAC, Cotral o Trenitalia, i servizi sono GARANTITI esclusivamente nelle fasce 06:00-09:00 e 17:00-20:00.',
                link: 'https://www.commissionegaranziasciopero.it/'
            },
            {
                id: 'fl2-base',
                category: 'fl2',
                isStrike: false,
                type: 'info',
                tag: 'Linea FL2',
                tagClass: 'tag-info',
                time: 'Stato Tratta',
                title: 'FL2 Roma Tiburtina ⇄ Guidonia ⇄ Tivoli',
                description: 'Circolazione sulle corse pendolari del nodo Roma-Guidonia. Consultare il monitor di Stazione o Infomobilità Trenitalia per eventuali ritardi istantanei.',
                link: 'https://www.trenitalia.com/it/informazioni/infomobilita/notizie-infomobilita.html'
            },
            {
                id: 'cotral-base',
                category: 'cotral',
                isStrike: false,
                type: 'info',
                tag: 'Cotral',
                tagClass: 'tag-info',
                time: 'Stato Tratta',
                title: 'Corse Guidonia - Roma Ponte Mammolo',
                description: 'Servizio extraurbano attivo lungo l\'asse Tiburtina. Gli orari possono subire variazioni in base al traffico sulla statale.',
                link: 'https://www.cotralspa.it/'
            },
            {
                id: 'atac-base',
                category: 'atac',
                isStrike: false,
                type: 'info',
                tag: 'ATAC & Metro',
                tagClass: 'tag-info',
                time: 'Stato Tratta',
                title: 'Rete Metro Roma (A, B/B1, C)',
                description: 'Servizio regolare sulle linee metropolitane con nodo di scambio FL2 presso la stazione Roma Tiburtina.',
                link: 'https://www.atac.roma.it/'
            }
        ];

        // FUNZIONE DI ORDINAMENTO GERARCHICO RIGIDO
        // 1. Scioperi
        // 2. Allerte Meteo
        // 3. Avvisi/Anomalie Trasporti
        // 4. Info Generali
        function sortFeedByHierarchy(items) {
            return items.sort((a, b) => {
                const getScore = (item) => {
                    if (item.isStrike || item.category === 'scioperi') return 1;
                    if (item.category === 'meteo' && (item.type === 'danger' || item.type === 'warning')) return 2;
                    if (item.category === 'meteo' && item.type === 'success') return 3;
                    if (item.type === 'danger' || item.type === 'warning') return 4;
                    return 5;
                };
                return getScore(a) - getScore(b);
            });
        }

        // Fetch Avvisi Live RSS via Proxy CORS Public
        async function fetchLiveRSS() {
            const rssUrl = 'https://astralmobilita.it/feed/';
            const proxyUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
            
            try {
                const res = await fetch(proxyUrl);
                const data = await res.json();
                
                if (data && data.status === 'ok' && data.items && data.items.length > 0) {
                    return data.items.map((item, idx) => {
                        const fullText = (item.title + " " + item.description).toLowerCase();
                        const isStrike = /sciopero|agitazione|astensione|proclamato/i.test(fullText);
                        const isFL2 = /fl2|guidonia|tivoli|roma-pescara|tiburtina/i.test(fullText);
                        const isCotral = /cotral/i.test(fullText);
                        const isAtac = /atac|metro|bus/i.test(fullText);

                        let cat = 'atac';
                        let tag = 'Mobilità Lazio';
                        if (isStrike) { cat = 'scioperi'; tag = '🚨 Sciopero Live'; }
                        else if (isFL2) { cat = 'fl2'; tag = 'FL2 Trenitalia'; }
                        else if (isCotral) { cat = 'cotral'; tag = 'Cotral'; }
                        else if (isAtac) { cat = 'atac'; tag = 'ATAC Roma'; }

                        // Pulizia tag HTML dal testo
                        const cleanDesc = item.description.replace(/<[^>]*>?/gm, '').trim().substring(0, 160) + '...';

                        return {
                            id: `rss-${idx}`,
                            category: cat,
                            isStrike: isStrike,
                            type: isStrike ? 'danger' : 'warning',
                            tag: tag,
                            tagClass: isStrike ? 'tag-danger' : 'tag-warning',
                            time: new Date(item.pubDate).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                            title: item.title,
                            description: cleanDesc,
                            link: item.link
                        };
                    });
                }
            } catch(e) {
                console.warn("Impossibile recuperare feed RSS live:", e);
            }
            return [];
        }

        // Fetch Meteo & Generazione Allerte Meteo
        async function fetchWeatherAndAlerts() {
            const locations = [
                { id: 'weather-guidonia', name: 'Guidonia', lat: 41.9961, lon: 12.7214 },
                { id: 'weather-roma', name: 'Roma', lat: 41.8919, lon: 12.5113 }
            ];

            const codeMap = {
                0: { icon: '☀️', text: 'Sereno' },
                1: { icon: '🌤️', text: 'Poco Nuvoloso' },
                2: { icon: '⛅', text: 'Parzialmente Nuvoloso' },
                3: { icon: '☁️', text: 'Coperto' },
                45: { icon: '🌫️', text: 'Nebbia' },
                51: { icon: '🌧️', text: 'Pioviggine' },
                61: { icon: '🌧️', text: 'Pioggia' },
                65: { icon: '🌧️', text: 'Pioggia Forte' },
                80: { icon: '🌦️', text: 'Rovesci' },
                95: { icon: '⛈️', text: 'Temporale' }
            };

            const weatherAlerts = [];

            for (const loc of locations) {
                try {
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,weather_code,wind_speed_10m&daily=precipitation_probability_max&timezone=Europe%2FRome`);
                    const data = await res.json();
                    
                    if (data && data.current) {
                        const temp = Math.round(data.current.temperature_2m);
                        const code = data.current.weather_code;
                        const weatherInfo = codeMap[code] || { icon: '🌡️', text: 'Meteo' };
                        
                        document.getElementById(loc.id).innerHTML = `<span>${weatherInfo.icon}</span> <span>${temp}°C</span>`;

                        const precipProb = data.daily?.precipitation_probability_max?.[0] || 0;
                        const wind = Math.round(data.current.wind_speed_10m || 0);

                        if (code >= 61 || precipProb > 50 || wind > 30) {
                            weatherAlerts.push({
                                id: `weather-alert-${loc.name.toLowerCase()}`,
                                category: 'meteo',
                                isStrike: false,
                                type: code >= 80 ? 'danger' : 'warning',
                                tag: '⚠️ Allerta Meteo',
                                tagClass: code >= 80 ? 'tag-danger' : 'tag-warning',
                                time: 'Oggi',
                                title: `Allerta Meteo ${loc.name}: ${weatherInfo.text} (${temp}°C)`,
                                description: `Rilevate precipitazioni (${precipProb}% di probabilità) o vento forte (${wind} km/h). Possibili rallentamenti sulla viabilità e sui bus extraurbani Cotral.`,
                                link: `https://www.ilmeteo.it/meteo/${loc.name}`
                            });
                        }
                    }
                } catch (e) {
                    document.getElementById(loc.id).textContent = 'N/D';
                }
            }

            if (weatherAlerts.length === 0) {
                weatherAlerts.push({
                    id: 'weather-ok',
                    category: 'meteo',
                    isStrike: false,
                    type: 'success',
                    tag: '🌤️ Meteo Regolare',
                    tagClass: 'tag-success',
                    time: 'Oggi',
                    title: 'Condizioni Meteo Stabili',
                    description: 'Nessuna allerta atmosferica critica registrata a Guidonia e Roma.',
                    link: null
                });
            }

            return weatherAlerts;
        }

        // Caricamento Dati Unificato
        async function loadAllFeedData() {
            const [liveRssItems, weatherAlerts] = await Promise.all([
                fetchLiveRSS(),
                fetchWeatherAndAlerts()
            ]);

            // Uniamo i dati Live con la base di fallback
            const combined = [...weatherAlerts, ...liveRssItems, ...transportAlertsBase];
            
            // Eliminiamo eventuali duplicati per ID
            const unique = Array.from(new Map(combined.map(item => [item.id, item])).values());

            // APPLICHIAMO LA GERARCHIA RIGIDA
            allFeedItems = sortFeedByHierarchy(unique);
            
            renderFeed();
        }

        function showTab(tab) {
            const percorsiSec = document.getElementById('section-percorsi');
            const feedSec = document.getElementById('section-feed');
            const btnPercorsi = document.getElementById('btn-percorsi');
            const btnFeed = document.getElementById('btn-feed');
            const title = document.getElementById('page-title');
            const subtitle = document.getElementById('page-subtitle');

            if (tab === 'percorsi') {
                feedSec.classList.remove('active');
                setTimeout(() => { percorsiSec.classList.add('active'); }, 50);

                btnPercorsi.classList.add('active');
                btnPercorsi.setAttribute('aria-selected', 'true');
                btnFeed.classList.remove('active');
                btnFeed.setAttribute('aria-selected', 'false');

                title.textContent = "Percorsi";
                subtitle.textContent = "Seleziona una tratta per visualizzare gli orari";
            } else {
                percorsiSec.classList.remove('active');
                setTimeout(() => { feedSec.classList.add('active'); }, 50);

                btnFeed.classList.add('active');
                btnFeed.setAttribute('aria-selected', 'true');
                btnPercorsi.classList.remove('active');
                btnPercorsi.setAttribute('aria-selected', 'false');

                title.textContent = "Feed & Avvisi";
                subtitle.textContent = "Scioperi, allerte meteo e stato delle linee";
            }
        }

        function filterFeed(category, chipElement) {
            currentFilter = category;
            document.querySelectorAll('.filter-chip').forEach(chip => chip.classList.remove('active'));
            if (chipElement) chipElement.classList.add('active');
            renderFeed();
        }

        function renderFeed() {
            const container = document.getElementById('feed-container');
            let filtered = allFeedItems;

            if (currentFilter === 'scioperi') {
                filtered = allFeedItems.filter(item => item.isStrike || item.category === 'scioperi');
            } else if (currentFilter !== 'all') {
                filtered = allFeedItems.filter(item => item.category === currentFilter);
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-feed">
                        Nessun avviso presente per la categoria selezionata.
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(item => `
                <article class="feed-card type-${item.type}">
                    <div class="feed-meta">
                        <div class="feed-tags">
                            <span class="tag-badge ${item.tagClass}">${item.tag}</span>
                        </div>
                        <span class="feed-time">${item.time}</span>
                    </div>
                    <h2>${item.title}</h2>
                    <p>${item.description}</p>
                    ${item.link ? `
                        <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="feed-action-link">
                            Dettagli ufficiali ➔
                        </a>
                    ` : ''}
                </article>
            `).join('');
        }

        async function refreshData() {
            const btn = document.getElementById('refresh-btn');
            btn.classList.add('spinning');
            await loadAllFeedData();
            setTimeout(() => { btn.classList.remove('spinning'); }, 600);
        }

        // Avvio Iniziale
        loadAllFeedData();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
