<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <title>Tratal | Home</title>
    <style>
        :root {
            /* Light Theme Palette */
            --bg: #ffffff;
            --surface: #f6f6f6;
            --surface-hover: #ededed;
            --border: #e0e0e0;
            --border-hover: #cccccc;
            
            --text-main: #111111;
            --text-muted: #666666;
            --text-subtle: #999999;
            
            --primary: #7543ea;
            --primary-light: #f1ecfe;
            --primary-border: #d8c8fc;

            --danger-bg: #fdeded;
            --danger-text: #e53935;
            --danger-border: #fbcfe8;

            --warning-bg: #fef5e7;
            --warning-text: #e67e22;
            --warning-border: #fdebd0;

            --info-bg: #f1ecfe;
            --info-text: #7543ea;
            --info-border: #d8c8fc;

            --success-bg: #edf7ed;
            --success-text: #2e7d32;
            --success-border: #c8e6c9;
            
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            
            --shadow-subtle: 0 2px 10px rgba(0, 0, 0, 0.04);
            --shadow-elevated: 0 12px 24px -6px rgba(0, 0, 0, 0.08);
            --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                /* Dark Theme */
                --bg: #000000;
                --surface: #121212;
                --surface-hover: #1e1e1e;
                --border: #242424;
                --border-hover: #383838;
                
                --text-main: #ffffff;
                --text-muted: #a0a0a0;
                --text-subtle: #666666;
                
                --primary: #a882ff;
                --primary-light: rgba(168, 130, 255, 0.15);
                --primary-border: rgba(168, 130, 255, 0.35);

                --danger-bg: rgba(229, 57, 53, 0.2);
                --danger-text: #f87171;
                --danger-border: rgba(229, 57, 53, 0.4);

                --warning-bg: rgba(230, 126, 34, 0.2);
                --warning-text: #fbbf24;
                --warning-border: rgba(230, 126, 34, 0.4);

                --info-bg: rgba(168, 130, 255, 0.15);
                --info-text: #a882ff;
                --info-border: rgba(168, 130, 255, 0.35);

                --success-bg: rgba(46, 125, 50, 0.2);
                --success-text: #4ade80;
                --success-border: rgba(46, 125, 50, 0.4);
                
                --shadow-subtle: 0 2px 10px rgba(0, 0, 0, 0.8);
                --shadow-elevated: 0 12px 24px -6px rgba(0, 0, 0, 0.9);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font);
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px 16px calc(88px + env(safe-area-inset-bottom)) 16px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 560px;
            margin: 0 auto;
            width: 100%;
        }

        /* Weather Widget */
        .weather-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 14px;
            margin-bottom: 24px;
            transition: all 0.3s ease;
        }

        .weather-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-decoration: none;
            color: inherit;
            box-shadow: var(--shadow-subtle);
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), 
                        border-color 0.2s ease, 
                        box-shadow 0.2s ease;
        }

        .weather-card:hover, .weather-card:focus-visible {
            transform: translateY(-2px);
            border-color: var(--border-hover);
            box-shadow: var(--shadow-elevated);
            outline: none;
        }

        .weather-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .weather-city {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .weather-condition {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-subtle);
        }

        .weather-body {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .weather-temp-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .weather-icon {
            font-size: 2.2rem;
            line-height: 1;
        }

        .weather-temp {
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: -0.03em;
        }

        .weather-details {
            text-align: right;
            font-size: 0.78rem;
            color: var(--text-muted);
            line-height: 1.4;
            font-weight: 500;
        }

        .weather-alert-box {
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.78rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            line-height: 1.35;
        }

        .weather-alert-box.danger {
            background-color: var(--danger-bg);
            color: var(--danger-text);
            border: 1px solid var(--danger-border);
        }

        .weather-alert-box.warning {
            background-color: var(--warning-bg);
            color: var(--warning-text);
            border: 1px solid var(--warning-border);
        }

        .weather-alert-box.ok {
            background-color: var(--success-bg);
            color: var(--success-text);
            border: 1px solid var(--success-border);
        }

        .skeleton {
            width: 100%;
            height: 48px;
            background: linear-gradient(90deg, var(--border) 25%, var(--surface-hover) 50%, var(--border) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 8px;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* App Header */
        header {
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
        }

        header h1 {
            font-size: 1.65rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--text-main);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 2px;
        }

        .btn-refresh {
            background-color: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-refresh:hover {
            color: var(--primary);
            border-color: var(--primary-border);
            background-color: var(--surface-hover);
        }

        .btn-refresh.spinning svg {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Tab Content Transitions */
        .tab-content {
            display: none;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .tab-content.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* Routes Layout */
        .routes-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .route-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 18px 20px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: var(--shadow-subtle);
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), 
                        border-color 0.2s ease, 
                        box-shadow 0.2s ease;
        }

        .route-card:hover, .route-card:focus-visible {
            transform: translateY(-2px);
            border-color: var(--primary-border);
            box-shadow: var(--shadow-elevated);
            outline: none;
        }

        .route-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .route-title {
            font-size: 1.05rem;
            font-weight: 600;
        }

        .route-icon-arrow {
            width: 18px;
            height: 18px;
            stroke: var(--text-subtle);
            transition: transform 0.2s ease, stroke 0.2s ease;
        }

        .route-card:hover .route-icon-arrow {
            transform: translateX(3px);
            stroke: var(--primary);
        }

        .badges-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .badge {
            font-size: 0.725rem;
            font-weight: 600;
            padding: 3px 9px;
            border-radius: 9999px;
            background-color: var(--bg);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        /* Feed Section */
        .feed-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .feed-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 18px 20px;
            box-shadow: var(--shadow-subtle);
            transition: transform 0.2s ease;
        }

        .feed-card.type-danger {
            border-left: 4px solid var(--danger-text);
        }

        .feed-card.type-warning {
            border-left: 4px solid var(--warning-text);
        }

        .feed-card.type-info {
            border-left: 4px solid var(--primary);
        }

        .feed-card.type-success {
            border-left: 4px solid var(--success-text);
        }

        .feed-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .feed-tags {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tag-badge {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 2px 8px;
            border-radius: var(--radius-sm);
        }

        .tag-danger {
            background-color: var(--danger-bg);
            color: var(--danger-text);
            border: 1px solid var(--danger-border);
        }

        .tag-warning {
            background-color: var(--warning-bg);
            color: var(--warning-text);
            border: 1px solid var(--warning-border);
        }

        .tag-info {
            background-color: var(--info-bg);
            color: var(--info-text);
            border: 1px solid var(--info-border);
        }

        .tag-success {
            background-color: var(--success-bg);
            color: var(--success-text);
            border: 1px solid var(--success-border);
        }

        .feed-time {
            font-size: 0.75rem;
            color: var(--text-subtle);
            font-weight: 500;
        }

        .feed-card h2 {
            font-size: 1.025rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .feed-card p {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .feed-action-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--primary);
            text-decoration: none;
        }

        .feed-action-link:hover {
            text-decoration: underline;
        }

        .empty-feed {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            background-color: var(--surface);
            border: 1px dashed var(--border);
            border-radius: var(--radius-lg);
        }

        .bottom-nav-wrapper {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            padding: 0 16px calc(12px + env(safe-area-inset-bottom)) 16px;
            pointer-events: none;
            z-index: 100;
        }

        .bottom-nav {
            pointer-events: auto;
            background-color: var(--surface);
            border: 1px solid var(--border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            border-radius: 9999px;
            padding: 4px;
            box-shadow: var(--shadow-elevated);
            width: 100%;
            max-width: 380px;
        }

        .nav-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            padding: 10px 16px;
            border-radius: 9999px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .nav-btn svg {
            width: 18px;
            height: 18px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
        }

        .nav-btn.active {
            background-color: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(168, 130, 255, 0.25);
        }
    </style>
</head>

    <script>
        let allFeedItems = [];

        function parseCleanText(htmlString) {
            if (!htmlString) return '';
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlString, 'text/html');
            return (doc.body.textContent || '').trim();
        }

        const transportAlertsBase = [
            {
                id: 'sciopero-garanzia',
                category: 'scioperi',
                isStrike: true,
                type: 'danger',
                tag: '🚨 Strike & Guarantees',
                tagClass: 'tag-danger',
                time: 'Always Valid Info',
                title: 'Public Transit Guaranteed Hours',
                description: 'In case of an announced strike for ATAC, Cotral, or Trenitalia, services are GUARANTEED exclusively during the 06:00-09:00 and 17:00-20:00 time slots.',
                link: 'https://www.commissionegaranziasciopero.it/'
            },
            {
                id: 'fl2-base',
                category: 'fl2',
                isStrike: false,
                type: 'info',
                tag: 'FL2 Line',
                tagClass: 'tag-info',
                time: 'Route Status',
                title: 'FL2 Roma Tiburtina ⇄ Guidonia ⇄ Tivoli',
                description: 'Commuter trains operating on the Rome-Guidonia route. Check station monitors or Trenitalia Infomobilità for real-time delay updates.',
                link: 'https://www.trenitalia.com/it/informazioni/infomobilita/notizie-infomobilita.html'
            },
            {
                id: 'cotral-base',
                category: 'cotral',
                isStrike: false,
                type: 'info',
                tag: 'Cotral',
                tagClass: 'tag-info',
                time: 'Route Status',
                title: 'Guidonia - Roma Ponte Mammolo Routes',
                description: 'Intercity bus service active along the Tiburtina route. Timetables may vary depending on highway traffic.',
                link: 'https://www.cotralspa.it/'
            },
            {
                id: 'atac-base',
                category: 'atac',
                isStrike: false,
                type: 'info',
                tag: 'ATAC & Metro',
                tagClass: 'tag-info',
                time: 'Route Status',
                title: 'Rome Metro Network (A, B/B1, C)',
                description: 'Regular service on metro lines with FL2 interchange at Roma Tiburtina station.',
                link: 'https://www.atac.roma.it/'
            }
        ];

        function sortFeedByHierarchy(items) {
            return items.sort((a, b) => {
                const getScore = (item) => {
                    if (item.isStrike || item.category === 'scioperi') return 1;
                    if (item.type === 'danger' || item.type === 'warning') return 2;
                    return 3;
                };
                return getScore(a) - getScore(b);
            });
        }

        async function fetchLiveRSS() {
            const rssUrl = 'https://astralmobilita.it/feed/';
            const proxyUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
            
            try {
                const res = await fetch(proxyUrl);
                const data = await res.json();
                
                if (data && data.status === 'ok' && data.items && data.items.length > 0) {
                    return data.items.map((item, idx) => {
                        const fullText = (item.title + " " + item.description).toLowerCase();
                        const isStrike = /sciopero|agitazione|astensione|proclamato|strike/i.test(fullText);
                        const isFL2 = /fl2|guidonia|tivoli|roma-pescara|tiburtina/i.test(fullText);
                        const isCotral = /cotral/i.test(fullText);
                        const isAtac = /atac|metro|bus/i.test(fullText);

                        let cat = 'atac';
                        let tag = 'Lazio Mobility';
                        if (isStrike) { cat = 'scioperi'; tag = '🚨 Live Strike'; }
                        else if (isFL2) { cat = 'fl2'; tag = 'FL2 Trenitalia'; }
                        else if (isCotral) { cat = 'cotral'; tag = 'Cotral'; }
                        else if (isAtac) { cat = 'atac'; tag = 'ATAC Roma'; }

                        const rawClean = parseCleanText(item.description);
                        const cleanDesc = rawClean.length > 160 ? rawClean.substring(0, 160) + '...' : rawClean;

                        return {
                            id: `rss-${idx}`,
                            category: cat,
                            isStrike: isStrike,
                            type: isStrike ? 'danger' : 'warning',
                            tag: tag,
                            tagClass: isStrike ? 'tag-danger' : 'tag-warning',
                            time: item.pubDate ? new Date(item.pubDate).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'Today',
                            title: parseCleanText(item.title),
                            description: cleanDesc,
                            link: item.link
                        };
                    });
                }
            } catch(e) {
                console.warn("Unable to fetch live RSS feed:", e);
            }
            return [];
        }

        async function fetchWeatherAndAlerts() {
            const locations = [
                { cardId: 'weather-card-guidonia', name: 'Guidonia', lat: 41.9961, lon: 12.7214 },
                { cardId: 'weather-card-roma', name: 'Rome', lat: 41.8919, lon: 12.5113 }
            ];

            const getWeatherInfo = (code) => {
                if (code === 0) return { icon: '☀️', text: 'Clear' };
                if (code === 1) return { icon: '🌤️', text: 'Mainly Clear' };
                if (code === 2) return { icon: '⛅', text: 'Partly Cloudy' };
                if (code === 3) return { icon: '☁️', text: 'Overcast' };
                if (code === 45 || code === 48) return { icon: '🌫️', text: 'Fog' };
                if (code >= 51 && code <= 57) return { icon: '🌧️', text: 'Drizzle' };
                if (code >= 61 && code <= 67) return { icon: '🌧️', text: 'Rain' };
                if (code >= 71 && code <= 77) return { icon: '❄️', text: 'Snow' };
                if (code >= 80 && code <= 82) return { icon: '🌦️', text: 'Rain Showers' };
                if (code >= 85 && code <= 86) return { icon: '🌨️', text: 'Snow Showers' };
                if (code >= 95) return { icon: '⛈️', text: 'Thunderstorm' };
                return { icon: '🌡️', text: 'Weather' };
            };

            for (const loc of locations) {
                const cardEl = document.getElementById(loc.cardId);
                if (!cardEl) continue;

                try {
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,weather_code,wind_speed_10m&daily=precipitation_probability_max&timezone=Europe%2FRome`);
                    const data = await res.json();
                    
                    if (data && data.current) {
                        const temp = Math.round(data.current.temperature_2m);
                        const code = data.current.weather_code;
                        const weatherInfo = getWeatherInfo(code);
                        const precipProb = data.daily?.precipitation_probability_max?.[0] || 0;
                        const wind = Math.round(data.current.wind_speed_10m || 0);

                        let alertBadgeHtml = '';
                        if (code >= 80 || wind > 50) {
                            alertBadgeHtml = `<div class="weather-alert-box danger">🚨 Alert: Thunderstorm / High Winds (${wind} km/h)</div>`;
                        } else if (code >= 61 || precipProb > 50 || wind > 30) {
                            alertBadgeHtml = `<div class="weather-alert-box warning">⚠️ Warning: Rain (${precipProb}%) / Wind (${wind} km/h)</div>`;
                        } else {
                            alertBadgeHtml = `<div class="weather-alert-box ok">🌤️ Regular weather conditions</div>`;
                        }

                        cardEl.innerHTML = `
                            <div class="weather-header">
                                <span class="weather-city">${loc.name}</span>
                                <span class="weather-condition">${weatherInfo.text}</span>
                            </div>
                            <div class="weather-body">
                                <div class="weather-temp-group">
                                    <span class="weather-icon">${weatherInfo.icon}</span>
                                    <span class="weather-temp">${temp}°C</span>
                                </div>
                                <div class="weather-details">
                                    <div>☔ Rain: ${precipProb}%</div>
                                    <div>💨 Wind: ${wind} km/h</div>
                                </div>
                            </div>
                            ${alertBadgeHtml}
                        `;
                    }
                } catch (e) {
                    cardEl.innerHTML = `
                        <div class="weather-header">
                            <span class="weather-city">${loc.name}</span>
                            <span class="weather-condition">Not available</span>
                        </div>
                        <div class="weather-alert-box warning">⚠️ Unable to load weather data</div>
                    `;
                }
            }
        }

        async function loadAllFeedData() {
            const [liveRssItems] = await Promise.all([
                fetchLiveRSS(),
                fetchWeatherAndAlerts()
            ]);

            const combined = [...liveRssItems, ...transportAlertsBase];
            const unique = Array.from(new Map(combined.map(item => [item.id, item])).values());

            allFeedItems = sortFeedByHierarchy(unique);
            renderFeed();
        }

        function showTab(tab) {
            const percorsiSec = document.getElementById('section-percorsi');
            const feedSec = document.getElementById('section-feed');
            const btnPercorsi = document.getElementById('btn-percorsi');
            const btnFeed = document.getElementById('btn-feed');
            const title = document.getElementById('page-title');
            const subtitle = document.getElementById('page-subtitle');
            const weatherGrid = document.getElementById('weather-grid');
            const headerEl = document.getElementById('app-header');

            if (tab === 'percorsi') {
                // Sposta il meteo sopra l'intestazione
                if (weatherGrid && headerEl) {
                    headerEl.before(weatherGrid);
                }

                feedSec.classList.remove('active');
                feedSec.setAttribute('aria-hidden', 'true');

                setTimeout(() => { 
                    percorsiSec.classList.add('active'); 
                    percorsiSec.setAttribute('aria-hidden', 'false');
                }, 50);

                btnPercorsi.classList.add('active');
                btnPercorsi.setAttribute('aria-selected', 'true');
                btnFeed.classList.remove('active');
                btnFeed.setAttribute('aria-selected', 'false');

                title.textContent = "Routes";
                subtitle.textContent = "Select a route to view schedules";
            } else {
                // Sposta il meteo sotto l'intestazione
                if (weatherGrid && headerEl) {
                    headerEl.after(weatherGrid);
                }

                percorsiSec.classList.remove('active');
                percorsiSec.setAttribute('aria-hidden', 'true');

                setTimeout(() => { 
                    feedSec.classList.add('active'); 
                    feedSec.setAttribute('aria-hidden', 'false');
                }, 50);

                btnFeed.classList.add('active');
                btnFeed.setAttribute('aria-selected', 'true');
                btnPercorsi.classList.remove('active');
                btnPercorsi.setAttribute('aria-selected', 'false');

                title.textContent = "Mobility Feed";
                subtitle.textContent = "Strikes, live alerts, and line status";
            }
        }

        function renderFeed() {
            const container = document.getElementById('feed-container');

            if (allFeedItems.length === 0) {
                container.innerHTML = `
                    <div class="empty-feed">
                        No mobility alerts at the moment.
                    </div>
                `;
                return;
            }

            container.innerHTML = allFeedItems.map(item => `
                <article class="feed-card type-${item.type}">
                    <div class="feed-meta">
                        <div class="feed-tags">
                            <span class="tag-badge ${item.tagClass}">${item.tag}</span>
                        </div>
                        <span class="feed-time">${item.time}</span>
                    </div>
                    <h2>${item.title}</h2>
                    <p>${item.description}</p>
                    ${item.link ? `
                        <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="feed-action-link">
                            Official details ➔
                        </a>
                    ` : ''}
                </article>
            `).join('');
        }

        async function refreshData() {
            const btn = document.getElementById('refresh-btn');
            btn.classList.add('spinning');
            try {
                await loadAllFeedData();
            } finally {
                setTimeout(() => { btn.classList.remove('spinning'); }, 500);
            }
        }

        loadAllFeedData();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
