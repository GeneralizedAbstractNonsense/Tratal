<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSS Dashboard</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --border-color: #334155;
      --danger: #ef4444;
      --sidebar-width: 280px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      background-color: #090d16;
      border-right: 1px solid var(--border-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: fixed;
      top: 0; bottom: 0; left: 0;
      overflow-y: auto;
    }

    .sidebar h1 {
      font-size: 1.2rem;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-group { display: flex; flex-direction: column; gap: 4px; }
    .nav-header { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); margin-top: 12px; margin-bottom: 4px; letter-spacing: 0.05em; }
    
    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 12px;
      border-radius: 6px;
      text-align: left;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-btn:hover, .nav-btn.active {
      background-color: var(--card-bg);
      color: var(--text-color);
    }

    /* Main Area */
    .main-content {
      margin-left: var(--sidebar-width);
      flex: 1;
      padding: 30px;
      max-width: 1200px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 25px;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-color);
      outline: none;
    }

    .filter-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card-bg);
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Feed Cards Grid */
    .feed-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .card-source {
      color: var(--accent);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }

    .card h3 {
      font-size: 1rem;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .card h3 a {
      color: var(--text-color);
      text-decoration: none;
    }

    .card h3 a:hover { color: var(--accent); }

    .card-snippet {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .card-footer {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .blocked-badge {
      background-color: rgba(239, 68, 68, 0.2);
      color: var(--danger);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
    }

    .status-msg {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      .sidebar { position: relative; width: 100%; height: auto; }
      .main-content { margin-left: 0; }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <h1>📡 Feed Dashboard</h1>
    <div class="nav-group">
      <button class="nav-btn active" onclick="filterCategory('all', this)">
        <span>Tutti i Feed</span>
      </button>
    </div>

    <div class="nav-header">Categorie</div>
    <div class="nav-group" id="categories-list">
      <!-- Categorie estratte dinamicamente dall'OPML -->
    </div>
  </aside>

  <main class="main-content">
    <div class="top-bar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Cerca negli articoli..." oninput="renderArticles()">
      </div>
      <label class="filter-toggle">
        <input type="checkbox" id="wordfilterToggle" checked onchange="renderArticles()">
        <span>Filtro Parole Attivo (<span id="blockedCount">0</span> nascosti)</span>
      </label>
    </div>

    <div id="statusMessage" class="status-msg">Lettura del file OPML in corso...</div>
    <div class="feed-grid" id="feedGrid"></div>
  </main>

  <script>
    // LISTA PAROLE BLOCCATE
    const BLOCKED_WORDS = [
      "Calciomercato","Gol","Basket","Pallacanestro","Tennis","Pallavolo","Football","Atleta",
      "Calciatore","Tennista","Pallavolista","Baseball","Champions League","Celebripost","Calcio",
      "Padel","Golf","Allenatore","Ranking Top 5","Checco Zalone","SS Lazio","Gran Premio","Pusher",
      "Bistrot","Shakira","Incendio","Incendi","Boxe","Wrestling","Automobilistica","MagicLand","Hashish",
      "Spaccio","Daspo","Atalanta","Arresto per spaccio","Arrestati per spaccio","Spaccio di droga",
      "Spaccio e detenzione","Dosi di cocaina","Dosi di hashish","Sequestro di cocaina","Sequestro di hashish",
      "Giro di spaccio","Piazza di spaccio","Derby","AS Roma","Fantacalcio","Vince in rimonta","Udinese",
      "Tennisti","Scippi","Scippare","Scippo","Furbetti","Chili di cocaina","Giallorossi","Giallorosso",
      "Romanisti","Tifosi","Cassa integrazione","Celebrano","Celebra","Botte","l'Inter","Fitness",
      "Red carpet","Auto contro il muro","Incidente stradale","Incidenti stradali","Squadra più forte",
      "Scippato","Scippata","Ciclisti","Etti di crack","Etti di cocaina","Etti di hashish","Piazze di spaccio",
      "Harry Styles","Tarzan","Jovanotti","Lazio-Milan","Roma-Milan","Netflix","Scudetto","Atletica",
      "Benji e Fede","Finale maschile","Finale femminile","Miglior attore","Chili di droga","Cocaina nascosta",
      "Hashish nascosta","Cannabis nascosta","Formula 1","Incidente via","Ciclista","Rugby","Incidente sulla",
      "Crack delivery","Ladre","Bodybuilding","Doping","Biancocelesti","Scasso","Ladri di rame","Aggiotaggio",
      "Coez","MotoGP","Chilo di cocaina","La Lazio","Autovelox","Starbucks","Totti","Ed Sheeran","Sport",
      "Campione d'incassi","Calciatori","Coppa Italia","Ronaldinho","Urban Trek","Scontro tra moto e van",
      "Fitwalking","Camminata solidale","Weekend a Roma","Tentata rapina","Resistenza a pubblico ufficiale",
      "Evening Post - Le storie di oggi","Eurovision","XFactor","X-Factor","Sanremo","Sequestrati",
      "Sequestrate","Sequestrato","Sequestro","Sequestri","Tirapugni","Coltello","Coltellino",
      "Aggressione con bottiglie","Festeggia","Rubata","Rubato","Rubati","Rubate","Successo della serie",
      "Festival di Venezia","Hollywood","Premio cinema","Modella","Attrice","Boom di","Europa League",
      "Venezia-Lazio","Casa del Cinema","Moto Show","Big match","Sequestrata","Roma-Inter","Dybala",
      "Il Barcellona","Miglior film","FIFA","la partita"
    ];

    const CORS_PROXY = "https://api.allorigins.win/raw?url=";
    const OPML_PATH = "./subscriptions.opml";

    let categoriesData = {}; // Memorizza { NomeCategoria: [ { url, title }, ... ] }
    let allArticles = [];
    let currentCategory = 'all';

    // 1. CARICAMENTO E PARSING DELL'OPML
    async function initDashboard() {
      const status = document.getElementById('statusMessage');
      try {
        const response = await fetch(OPML_PATH);
        if (!response.ok) throw new Error("Impossibile caricare il file OPML");
        
        const opmlText = await response.text();
        parseOPML(opmlText);
        
        renderCategoriesUI();
        
        status.textContent = "Caricamento degli articoli dai feed RSS...";
        await fetchAllFeeds();
        
        status.style.display = 'none';
        renderArticles();
      } catch (err) {
        status.textContent = `Errore: ${err.message}. Verificare che 'subscriptions.opml' sia presente nel repository.`;
        console.error(err);
      }
    }

    function parseOPML(xmlText) {
      const parser = new DOMParser();
      const xml = parser.parseFromString(xmlText, "text/xml");
      
      const feedOutlines = xml.querySelectorAll("outline[xmlUrl]");
      
      feedOutlines.forEach(outline => {
        const url = outline.getAttribute("xmlUrl");
        const feedTitle = outline.getAttribute("title") || outline.getAttribute("text") || "Feed";
        
        // Trova la categoria padre (se presente)
        const parent = outline.parentElement;
        let catName = "Generale";
        if (parent && parent.tagName.toLowerCase() === "outline") {
          catName = parent.getAttribute("text") || parent.getAttribute("title") || "Generale";
        }

        if (!categoriesData[catName]) {
          categoriesData[catName] = [];
        }

        categoriesData[catName].push({ url, title: feedTitle });
      });
    }

    // 2. RECUPERO FEED RSS/ATOM
    async function fetchAllFeeds() {
      const fetchPromises = [];

      for (const [catName, feeds] of Object.entries(categoriesData)) {
        for (const feed of feeds) {
          fetchPromises.push(fetchSingleFeed(catName, feed));
        }
      }

      await Promise.allSettled(fetchPromises);
      
      // Ordina gli articoli dal più recente al più vecchio
      allArticles.sort((a, b) => b.date - a.date);
    }

    async function fetchSingleFeed(category, feedObj) {
      try {
        const res = await fetch(CORS_PROXY + encodeURIComponent(feedObj.url));
        if (!res.ok) return;
        
        const text = await res.text();
        const xml = new DOMParser().parseFromString(text, "text/xml");

        const items = xml.querySelectorAll("item");
        const entries = xml.querySelectorAll("entry");

        if (items.length > 0) {
          items.forEach(item => parseRSSItem(item, category, feedObj.title));
        } else if (entries.length > 0) {
          entries.forEach(entry => parseAtomEntry(entry, category, feedObj.title));
        }
      } catch (e) {
        console.warn(`Errore recupero feed: ${feedObj.url}`, e);
      }
    }

    function parseRSSItem(item, category, fallbackSource) {
      const title = item.querySelector("title")?.textContent || "Senza titolo";
      const link = item.querySelector("link")?.textContent || "#";
      const pubDate = item.querySelector("pubDate")?.textContent;
      const description = item.querySelector("description")?.textContent || "";

      allArticles.push({
        title,
        link,
        date: pubDate ? new Date(pubDate) : new Date(0),
        snippet: cleanText(description),
        source: fallbackSource,
        category
      });
    }

    function parseAtomEntry(entry, category, fallbackSource) {
      const title = entry.querySelector("title")?.textContent || "Senza titolo";
      const link = entry.querySelector("link")?.getAttribute("href") || "#";
      const published = entry.querySelector("published, updated")?.textContent;
      const summary = entry.querySelector("summary, content")?.textContent || "";

      allArticles.push({
        title,
        link,
        date: published ? new Date(published) : new Date(0),
        snippet: cleanText(summary),
        source: fallbackSource,
        category
      });
    }

    function cleanText(html) {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      return doc.body.textContent || "";
    }

    // 3. WORDFILTER LOGIC
    function isBlocked(text) {
      if (!text) return false;
      const lower = text.toLowerCase();
      return BLOCKED_WORDS.some(word => lower.includes(word.toLowerCase()));
    }

    // 4. RENDERING INTERFACCIA
    function renderCategoriesUI() {
      const container = document.getElementById('categories-list');
      container.innerHTML = '';

      Object.keys(categoriesData).forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'nav-btn';
        btn.innerHTML = `<span>${escapeHTML(cat)}</span>`;
        btn.onclick = () => filterCategory(cat, btn);
        container.appendChild(btn);
      });
    }

    function filterCategory(catName, element) {
      currentCategory = catName;
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      element.classList.add('active');
      renderArticles();
    }

    function renderArticles() {
      const grid = document.getElementById('feedGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();
      const filterActive = document.getElementById('wordfilterToggle').checked;
      
      grid.innerHTML = '';
      let blockedCount = 0;

      const filtered = allArticles.filter(art => {
        // Categoria
        if (currentCategory !== 'all' && art.category !== currentCategory) return false;

        // Ricerca
        if (search && !art.title.toLowerCase().includes(search) && !art.snippet.toLowerCase().includes(search)) {
          return false;
        }

        // Filtro parole
        const blocked = isBlocked(art.title) || isBlocked(art.snippet);
        if (blocked) {
          blockedCount++;
          if (filterActive) return false;
        }

        return true;
      });

      document.getElementById('blockedCount').textContent = blockedCount;

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">Nessun articolo trovato.</div>`;
        return;
      }

      filtered.forEach(art => {
        const blocked = isBlocked(art.title) || isBlocked(art.snippet);
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <div class="card-header">
              <span class="card-source">${escapeHTML(art.source)}</span>
              <span>${art.date.getTime() !== 0 ? art.date.toLocaleDateString() : ''}</span>
            </div>
            <h3>
              <a href="${art.link}" target="_blank" rel="noopener">${escapeHTML(art.title)}</a>
            </h3>
            <div class="card-snippet">${escapeHTML(art.snippet)}</div>
          </div>
          <div class="card-footer">
            <span>${escapeHTML(art.category)}</span>
            ${blocked ? `<span class="blocked-badge">Filtro applicato</span>` : ''}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // Inizio
    window.addEventListener('DOMContentLoaded', initDashboard);
  </script>
</body>
</html>
