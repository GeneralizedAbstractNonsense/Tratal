<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
    <title>Casa ➔ Scuola | Orari</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --border-color: #e2e8f0;
            --radius: 16px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
            padding: 16px;
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .back-btn {
            text-decoration: none;
            color: var(--accent-color);
            font-weight: 600;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .page-title {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .section-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .section-title {
            font-size: 1.05rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            background-color: #eff6ff;
            color: var(--accent-color);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .direct-btn {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            background-color: var(--accent-color);
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background-color 0.2s;
            border: none;
            cursor: pointer;
        }

        .direct-btn:hover {
            background-color: var(--accent-hover);
        }

        .iframe-container {
            position: relative;
            width: 100%;
            height: 550px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background-color: #f1f5f9;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        @media (max-width: 600px) {
            .iframe-container {
                height: 460px;
            }
            .section-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn">← Torna alle Tratte</a>
        <h1 class="page-title">Casa ➔ Scuola</h1>
    </header>

    <main>
        <section class="section-card">
            <div class="section-header">
                <div>
                    <div class="section-title">
                        <span>1. Bus Cotral</span>
                        <span class="badge">Bus Interurbano</span>
                    </div>
                    <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 2px;">
                        Guidonia (Viale Roma - Aeroporto) ➔ Bagni di Tivoli (Via Morante / Via Tiburtina)
                    </p>
                </div>
                <a href="https://cotralspa.it/ricerca-orari/?search=bus&lang=it&departureStopId=60717&departureStopName=GUIDONIA%20|%20Viale%20Roma%20(Aeroporto)&departureLocalityId=8007880&departureLocalityName=Guidonia%20Montecelio&completed=true&lang=it&arriveStopId=60719&arriveStopName=GUIDONIA%20|%20Via%20Morante%20Via%20Tiburtina&arriveLocalityId=8001858&arriveLocalityName=Bagni%20di%20Tivoli&completed=true" target="_blank" rel="noopener" class="direct-btn">
                    Apri Orari Cotral ↗
                </a>
            </div>

            <div class="iframe-container">
                <iframe src="https://cotralspa.it/ricerca-orari/?search=bus&lang=it&departureStopId=60717&departureStopName=GUIDONIA%20|%20Viale%20Roma%20(Aeroporto)&departureLocalityId=8007880&departureLocalityName=Guidonia%20Montecelio&completed=true&lang=it&arriveStopId=60719&arriveStopName=GUIDONIA%20|%20Via%20Morante%20Via%20Tiburtina&arriveLocalityId=8001858&arriveLocalityName=Bagni%20di%20Tivoli&completed=true" title="Cotral Casa Scuola"></iframe>
            </div>
        </section>
    </main>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
