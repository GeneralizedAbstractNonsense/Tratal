<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
    <title>Dashboard Trasporti</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 24px 16px;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
            padding-top: 12px;
        }

        header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        main {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            flex: 1;
        }

        .grid-routes {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 520px) {
            .grid-routes {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .route-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 24px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 120px;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease-in-out;
            -webkit-tap-highlight-color: transparent;
        }

        .route-card:hover, .route-card:focus-visible {
            transform: translateY(-2px);
            border-color: var(--accent-color);
            box-shadow: var(--shadow-hover);
            outline: none;
        }

        .route-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .route-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .icon {
            font-size: 1.2rem;
            color: var(--accent-color);
        }

        .route-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: var(--text-secondary);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Orari Trasporti</h1>
        <p>Seleziona una tratta per consultare gli orari</p>
    </header>

    <main>
        <div class="grid-routes">
            <a href="casa-universita.html" class="route-card">
                <div class="route-info">
                    <span class="route-title">Casa ➔ Università</span>
                    <span class="icon">➔</span>
                </div>
                <span class="route-subtitle">Cotral, ATAC, Trenitalia</span>
            </a>

            <a href="universita-casa.html" class="route-card">
                <div class="route-info">
                    <span class="route-title">Università ➔ Casa</span>
                    <span class="icon">➔</span>
                </div>
                <span class="route-subtitle">Cotral, ATAC, Trenitalia</span>
            </a>

            <a href="casa-scuola.html" class="route-card">
                <div class="route-info">
                    <span class="route-title">Casa ➔ Scuola</span>
                    <span class="icon">➔</span>
                </div>
                <span class="route-subtitle">Cotral, ATAC, Trenitalia</span>
            </a>

            <a href="scuola-casa.html" class="route-card">
                <div class="route-info">
                    <span class="route-title">Scuola ➔ Casa</span>
                    <span class="icon">➔</span>
                </div>
                <span class="route-subtitle">Cotral, ATAC, Trenitalia</span>
            </a>
        </div>
    </main>

    <footer>
        <p>Dashboard personale orari</p>
    </footer>

    <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>

</body>
</html>
