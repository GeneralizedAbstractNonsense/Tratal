name: Aggiornamento Orari e Avvisi Cotral

on:
  push:
    branches:
      - main  # o master, in base al nome del tuo ramo
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check-out del codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installazione Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Esecuzione Scraper
        run: |
          python scripts/scrape_cotral.py
          python scripts/scrape_casa_universita.py

      - name: Commit e Push dei dati aggiornati
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cotral_data.json casa_universita_data.json
          git status
          git diff-index --quiet HEAD || (git commit -m "bot: aggiornamento automatico orari [skip ci]" && git push)
