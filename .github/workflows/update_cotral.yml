name: Aggiornamento Orari e Avvisi Cotral

on:
  schedule:
    # Esegue lo script ogni giorno alle 04:00 UTC (6:00 italiane)
    - cron: '0 4 * * *'
  workflow_dispatch: # Permette l'avvio manuale dalla scheda Actions di GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check-out del codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installazione Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Esecuzione Scraper
        run: python scripts/scrape_cotral.py

      - name: Commit e Push dei dati aggiornati
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cotral_data.json
          git status
          git diff-index --quiet HEAD || (git commit -m "bot: aggiornamento orari e avvisi Cotral [skip ci]" && git push)
