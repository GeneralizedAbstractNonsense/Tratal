<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <title>Casa ➔ Nuova Tratta | Orari</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <a href="index.html" class="back-btn" aria-label="Torna alle Tratte">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                <span>Tratte</span>
            </a>
            <h1 class="page-title">Casa ➔ Nuova Tratta</h1>
        </header>

        <main>
            <!-- TAPPA 1: COTRAL -->
            <section class="step-card">
                <div class="step-header">
                    <div class="step-title-group">
                        <div class="step-title">
                            <span class="step-number">1</span>
                            <span>Bus Cotral</span>
                            <span class="badge">Bus Interurbano</span>
                        </div>
                        <p class="step-subtitle">Guidonia (Viale Roma) ➔ Bagni di Tivoli</p>
                    </div>
                </div>

              
                <div data-cotral-url="https://cotralspa.it/ricerca-orari/?search=bus&lang=it&departureStopId=60717&departureStopName=GUIDONIA%20|%20Viale%20Roma%20(Aeroporto)&departureLocalityId=8007880&departureLocalityName=Guidonia%20Montecelio&completed=true&lang=it&arriveStopId=60722&arriveStopName=GUIDONIA%20COLLE%20FIORITO%20|%20Stazione%20FS&arriveLocalityId=8007880&arriveLocalityName=Guidonia%20Montecelio&completed=true" data-label="Orari Cotral"></div>
            </section>

            <!-- TAPPA 2: TRENITALIA -->
            <section class="step-card">
                <div class="step-header">
                    <div class="step-title-group">
                        <div class="step-title">
                            <span class="step-number">2</span>
                            <span>Trenitalia (FL2)</span>
                            <span class="badge">Treno</span>
                        </div>
                        <p class="step-subtitle">Guidonia Montecelio ➔ Roma Tiburtina (Live)</p>
                    </div>
                </div>

                <!-- ID STATION, TRAIN FILTER, MONITOR -->
                <div data-treni-station="S08023" data-treni-filter="ROMA,TIBURTINA,TERMINI" data-rfi-url="https://iechub.rfi.it/ArriviPartenze/ArrivalsDepartures/Monitor?Arrivals=False&Search=guidonia&PlaceId=3616"></div>
            </section>

            <!-- TAPPA 3: ATAC -->
            <section class="step-card">
                <div class="step-header">
                    <div class="step-title-group">
                        <div class="step-title">
                            <span class="step-number">3</span>
                            <span>ATAC Roma</span>
                            <span class="badge">Bus / Tram</span>
                        </div>
                        <p class="step-subtitle">Tabella orari in tempo reale</p>
                    </div>
                </div>

                <!-- ATAC CODES -->
                <div data-atac-lines="492A, 163R, 545R, 71A"></div>
            </section>
        </main>
    </div>

    <!-- SCRIPTS -->
    <script src="js/atac.js" defer></script>
    <script src="js/components.js" defer></script>
</body>
</html>
